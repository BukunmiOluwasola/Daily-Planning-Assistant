# Netlify serves the full app: static frontend (public/) + Express API as a
# serverless function backed by persistent Netlify Blobs (no SQLite file,
# which cannot persist on serverless). Local runs still use SQLite (npm start).
[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"
  external_node_modules = ["better-sqlite3"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
